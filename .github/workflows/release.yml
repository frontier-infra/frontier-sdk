name: Release

# npm trusted publishing (OIDC): no tokens, provenance attached.
# Requires each package to have this repo+workflow configured as a
# trusted publisher on npmjs.com (Settings > Publishing access).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      FRONTIER_AVL_CLI: ${{ github.workspace }}/frontier-infra/avl/dist/cli.js
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontier-infra/frontier-sdk
      - uses: actions/checkout@v4
        with:
          repository: frontier-infra/plugins
          path: frontier-infra/plugins
      - uses: actions/checkout@v4
        with:
          repository: frontier-infra/the-machine
          path: frontier-infra/the-machine
      - uses: actions/checkout@v4
        with:
          repository: frontier-infra/agentcontrolplane
          path: frontier-infra/agentcontrolplane
      - uses: actions/checkout@v4
        with:
          repository: frontier-infra/avl
          path: frontier-infra/avl
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            frontier-infra/frontier-sdk/package-lock.json
            frontier-infra/avl/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.8
      - name: Install locked SDK workspace
        working-directory: frontier-infra/frontier-sdk
        run: npm ci --ignore-scripts
      - name: Build the pinned AVL checkout
        working-directory: frontier-infra/avl
        run: npm ci && npm run build
      - name: Install pinned Chromium
        run: |
          npx --yes playwright@1.54.2 install --with-deps chromium
          chromium_bin="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f \( -name chrome -o -name headless_shell \) -perm -111 | head -n 1)"
          test -n "$chromium_bin"
          echo "FRONTIER_CHROMIUM_BIN=$chromium_bin" >> "$GITHUB_ENV"
      - name: Verify and assemble every Foundation package without publishing
        working-directory: frontier-infra/frontier-sdk
        run: npm run rc:verify
      - name: Publish packages with new versions
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: frontier-infra/frontier-sdk
        run: |
          for pkg in packages/typescript/protocol packages/typescript/audit; do
            name=$(node -p "require('./$pkg/package.json').name")
            ver=$(node -p "require('./$pkg/package.json').version")
            if [ "$(npm view "$name@$ver" version 2>/dev/null)" = "$ver" ]; then
              echo "$name@$ver already on the registry, skipping"
            else
              (cd "$pkg" && npm publish --provenance --access public)
            fi
          done
