# Reference shape only. This is not a production-ready deployment file.
services:
  app:
    image: ghcr.io/your-org/__PROJECT_NAME__:replace-with-release-tag
    env_file:
      - ./config/production.reference.env
    depends_on:
      - postgres
      - redis
    ports:
      - "8787:8787"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frontier
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: replace-with-secret-manager-value
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  s3-reference:
    image: minio/minio:RELEASE.2026-07-31T15-35-50Z
    command: server /data
    environment:
      MINIO_ROOT_USER: replace-with-secret-manager-value
      MINIO_ROOT_PASSWORD: replace-with-secret-manager-value
    volumes:
      - object-data:/data

volumes:
  postgres-data:
  redis-data:
  object-data:
