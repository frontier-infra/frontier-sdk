[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-protocol"
version = "0.1.0"
description = "Provider- and harness-neutral Frontier protocol types and reference reducers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frontier Infra" }]

[tool.setuptools.packages.find]
where = ["src"]
